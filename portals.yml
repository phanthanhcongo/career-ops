# Portal Scanner Configuration
# Used by /career-ops scan to discover new offers automatically.
#
# Strategy (3 levels):
#   1. Playwright → careers_url of each company (real-time, reliable)
#   2. Greenhouse API → structured JSON (fast, Greenhouse-only)
#   3. WebSearch with site: filters (broad discovery, may be stale)
#
# IMPORTANT: Each company in tracked_companies MUST have careers_url.
#
# HOW TO CUSTOMIZE:
#   1. Copy this file to portals.yml in the project root
#   2. Edit title_filter.positive with YOUR target role keywords
#   3. Add/remove companies in tracked_companies
#   4. Adjust search_queries for your preferred job boards
#   5. Set enabled: false on companies you don't care about

# -- Title filter --
# The scanner uses these keywords to decide if a title is relevant.
# At least 1 positive must match AND 0 negatives must match (case-insensitive).

title_filter:
  positive:
    # [CUSTOMIZE] Add keywords matching YOUR target roles
    # -- AI/ML roles --
    - "AI"
    - "ML"
    - "LLM"
    - "Agent"
    - "Agentic"
    - "GenAI"
    - "Generative AI"
    - "NLP"
    - "LLMOps"
    - "MLOps"
    - "Voice AI"
    - "Conversational AI"
    - "Speech"
    # -- Vietnamese keywords --
    - "Trí tuệ nhân tạo"
    - "Kỹ sư AI"
    - "Kỹ sư phần mềm"
    # -- Engineering roles --
    - "Platform Engineer"
    - "Solutions Architect"
    - "Solutions Engineer"
    - "Software Engineer"
    - "Backend Engineer"
    - "Frontend Engineer"
    - "Full Stack"
    - "DevOps"
    - "Data Engineer"
    - "Data Scientist"
    - "Customer Engineer"
    - "Integration Engineer"
    # -- Product roles --
    - "Product Manager"
    - "Technical PM"
    - "Project Manager"
    # -- Automation roles --
    - "Automation"
    - "Low-Code"
    - "No-Code"
  negative:
    # [CUSTOMIZE] Add keywords for roles you want to exclude
    - "Intern"
    - "Thực tập"
    - "Embedded"
    - "Firmware"
    - "FPGA"
    - "ASIC"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "Salesforce Admin"
    - "SAP "
    - "Oracle EBS"
    - "Mainframe"
    - "COBOL"
  seniority_boost:
    # These prefixes add relevance but are not required
    - "Senior"
    - "Staff"
    - "Principal"
    - "Lead"
    - "Head"
    - "Director"
    - "Trưởng nhóm"
    - "Trưởng phòng"

# -- Location filter --
# When enabled, the scanner will only keep jobs whose location
# matches at least one positive keyword (case-insensitive).
# This applies to API-scanned results (Greenhouse, Ashby, Lever).
# WebSearch queries should already be targeted by location in the query itself.

location_filter:
  enabled: true
  positive:
    - "Hanoi"
    - "Ha Noi"
    - "Hà Nội"
    - "Vietnam"
    - "Viet Nam"
    - "Việt Nam"

# -- Search queries --
# Each query triggers a WebSearch. Use site: to filter by portal.
# The scanner extracts title, URL, and company from results.
# [CUSTOMIZED] All queries targeted to Hanoi, Vietnam market.

search_queries:

  # ══════════════════════════════════════════════════════════════════
  # Vietnamese job boards (primary sources for Hanoi market)
  # ══════════════════════════════════════════════════════════════════

  # -- ITViec (top Vietnam IT job board) --
  - name: ITViec — AI/ML Hanoi
    query: 'site:itviec.com "AI" OR "ML" OR "Machine Learning" OR "Data Scientist" Hanoi OR "Ha Noi"'
    enabled: true

  - name: ITViec — Software Engineer Hanoi
    query: 'site:itviec.com "Software Engineer" OR "Backend" OR "Full Stack" OR "Frontend" Hanoi OR "Ha Noi"'
    enabled: true

  - name: ITViec — DevOps & Platform Hanoi
    query: 'site:itviec.com "DevOps" OR "Platform Engineer" OR "SRE" OR "Cloud" Hanoi OR "Ha Noi"'
    enabled: true

  - name: ITViec — Data Engineer Hanoi
    query: 'site:itviec.com "Data Engineer" OR "Data Analyst" OR "Big Data" Hanoi OR "Ha Noi"'
    enabled: true

  - name: ITViec — Product Manager Hanoi
    query: 'site:itviec.com "Product Manager" OR "Project Manager" OR "Technical PM" Hanoi OR "Ha Noi"'
    enabled: true

  # -- TopDev --
  - name: TopDev — AI/ML Hanoi
    query: 'site:topdev.vn "AI" OR "ML" OR "Machine Learning" OR "NLP" "Hà Nội" OR "Hanoi"'
    enabled: true

  - name: TopDev — Software Engineer Hanoi
    query: 'site:topdev.vn "Software Engineer" OR "Lập trình" OR "Backend" OR "Full Stack" "Hà Nội" OR "Hanoi"'
    enabled: true

  - name: TopDev — DevOps Hanoi
    query: 'site:topdev.vn "DevOps" OR "Cloud" OR "Platform" "Hà Nội" OR "Hanoi"'
    enabled: true

  # -- VietnamWorks --
  - name: VietnamWorks — AI & Data Hanoi
    query: 'site:vietnamworks.com "AI" OR "Machine Learning" OR "Data" OR "NLP" Hanoi'
    enabled: true

  - name: VietnamWorks — Software Hanoi
    query: 'site:vietnamworks.com "Software Engineer" OR "Developer" OR "Full Stack" Hanoi'
    enabled: true

  # -- TopCV --
  - name: TopCV — AI & Tech Hanoi
    query: 'site:topcv.vn "AI" OR "Machine Learning" OR "Software Engineer" OR "Data" "Hà Nội"'
    enabled: true

  # -- CareerBuilder Vietnam --
  - name: CareerBuilder VN — AI & Tech Hanoi
    query: 'site:careerbuilder.vn "AI" OR "Machine Learning" OR "Software Engineer" OR "DevOps" Hanoi OR "Hà Nội"'
    enabled: true

  # -- LinkedIn Vietnam --
  - name: LinkedIn — AI Vietnam Hanoi
    query: 'site:linkedin.com/jobs "AI" OR "Machine Learning" OR "LLM" Hanoi Vietnam'
    enabled: true

  - name: LinkedIn — Software Engineer Hanoi
    query: 'site:linkedin.com/jobs "Software Engineer" OR "Backend" OR "Full Stack" Hanoi Vietnam'
    enabled: true

  # ══════════════════════════════════════════════════════════════════
  # International ATS boards — filtered to Vietnam / Hanoi
  # ══════════════════════════════════════════════════════════════════

  - name: Greenhouse — Vietnam roles
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io Vietnam OR Hanoi OR "Ha Noi"'
    enabled: true

  - name: Ashby — Vietnam roles
    query: 'site:jobs.ashbyhq.com Vietnam OR Hanoi OR "Ha Noi"'
    enabled: true

  - name: Lever — Vietnam roles
    query: 'site:jobs.lever.co Vietnam OR Hanoi OR "Ha Noi"'
    enabled: true

  - name: Workable — Vietnam roles
    query: 'site:apply.workable.com Vietnam OR Hanoi OR "Ha Noi"'
    enabled: true

  # -- General discovery --
  - name: General — AI Jobs Hanoi
    query: '"AI Engineer" OR "Machine Learning Engineer" OR "Data Scientist" Hanoi Vietnam job'
    enabled: true

  - name: General — Tech Jobs Hanoi
    query: '"Software Engineer" OR "Full Stack" OR "Backend Engineer" OR "DevOps" Hanoi Vietnam job 2026'
    enabled: true

